# `supabase config push` only changes what this file declares, so keep it to
# settings managed from this repo. Everything else (SMTP, MFA, Site URL,
# password rules) stays as set in the Supabase dashboard.
project_id = "OfficeTruck"

[auth.email.template.confirmation]
subject = "Confirm your OfficeTruck account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your OfficeTruck password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new OfficeTruck email"
content_path = "./supabase/templates/email-change.html"
